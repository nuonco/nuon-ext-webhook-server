name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser dry run
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
